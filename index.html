<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catch Mi If You Can</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      :root {
        --primary: #4f46e5;
        --header-bg: #334155;
        --blue: #0284c7;
        --bg: #f8fafc;
        --surface: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --radius: 12px;
        --amber-bg: #fef3c7;
        --amber-text: #92400e;
        --amber-border: #fcd34d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text-main);
      }
      header {
        flex: 0 0 auto;
        background: var(--header-bg);
        color: #fff;
        padding: 0.7rem 1rem;
        text-align: center;
      }
      header h1 {
        margin: 0;
        font-size: 1.05rem;
      }
      header p {
        margin: 0.15rem 0 0;
        color: #cbd5e1;
        font-size: 0.75rem;
      }
      .controls-bar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 1.4rem;
        align-items: flex-end;
        padding: 1rem 1.25rem;
        background: var(--surface);
        border-bottom: none;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        position: relative;
        z-index: 1;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .field label,
      .field > span,
      .stat-label {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
      }
      .stat-value {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text-main);
      }
      .field input {
        padding: 0.4rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.95rem;
        width: 130px;
      }
      .field select {
        padding: 0.4rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.9rem;
      }
      .status {
        flex: 1 1 220px;
        min-width: 200px;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 0.6rem 0.9rem;
        border-radius: 8px;
        background: var(--amber-bg);
        color: var(--amber-text);
        border: 1px solid var(--amber-border);
      }
      .status-dot {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--amber-text);
        display: none;
      }
      .status-dot.live {
        display: block;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(146, 64, 14, 0.45);
        }
        70% {
          box-shadow: 0 0 0 7px rgba(146, 64, 14, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(146, 64, 14, 0);
        }
      }
      .layout {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0 0.5rem 0.5rem;
      }
      #map-pane {
        position: relative;
        flex: 0 0 42vh;
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      #map {
        position: absolute;
        inset: 0;
      }
      .sidebar {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 1.1rem 1.25rem 1.4rem;
        background: var(--surface);
        border: none;
        border-radius: var(--radius);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        transition:
          flex-grow 0.25s ease,
          flex-basis 0.25s ease,
          opacity 0.2s ease,
          padding 0.25s ease;
        opacity: 1;
      }
      .sidebar.collapsed {
        flex: 0 0 0;
        opacity: 0;
        padding: 0;
        overflow: hidden;
        box-shadow: none;
        pointer-events: none;
      }
      #layout.sidebar-collapsed #map-pane {
        flex: 1 1 auto;
      }
      @media (min-width: 768px) {
        .layout {
          flex-direction: row;
        }
        #map-pane {
          flex: 1 1 auto;
        }
        .sidebar {
          flex: 0 0 380px;
        }
      }
      .sidebar-toggle {
        flex: 0 0 auto;
        width: 100%;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface);
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        color: var(--text-muted);
        font-size: 0.85rem;
        line-height: 1;
        cursor: pointer;
        padding: 0;
      }
      .sidebar-toggle:hover {
        color: var(--text-main);
      }
      @media (min-width: 768px) {
        .sidebar-toggle {
          width: 20px;
          height: auto;
          align-self: stretch;
        }
      }
      .note {
        font-size: 0.78rem;
        color: var(--text-muted);
        margin: 0 0 0.9rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        margin-bottom: 0.9rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.55rem 0.5rem;
        border-bottom: 1px solid #f1f5f9;
      }
      th {
        background: var(--surface);
        position: sticky;
        top: 0;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.05em;
      }
      tr.now td {
        background: #eff6ff;
        position: relative;
      }
      tr.now td:first-child::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--primary);
      }
      .tag {
        display: inline-block;
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: var(--blue);
        color: #fff;
        border-radius: 9999px;
        padding: 2px 8px;
        margin-left: 6px;
      }
      .tag.water {
        background: #e0f2fe;
        color: #0284c7;
      }
      footer {
        font-size: 0.75rem;
        color: var(--text-muted);
      }
      footer a {
        color: var(--blue);
      }
      button {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 0.4rem 0.7rem;
        font-size: 0.8rem;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>

    <header>
      <h1>Catch Mi If You Can</h1>
    </header>

    <div class="controls-bar">
      <div class="field">
        <span class="stat-label">Race date</span>
        <div class="stat-value">Sun, 4 Oct 2026</div>
      </div>
      <div class="field">
        <span class="stat-label">Wave &amp; pace</span>
        <div class="stat-value">11:07 start · 7:00 /km</div>
      </div>
      <div class="status" id="status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Enter details above</span>
      </div>
    </div>

    <div class="layout" id="layout">
      <div id="map-pane">
        <div id="map"></div>
      </div>

      <button
        type="button"
        class="sidebar-toggle"
        id="sidebar-toggle"
        aria-expanded="true"
        aria-controls="sidebar"
        aria-label="Toggle mile-by-mile panel"
      >
        <span id="sidebar-chevron" aria-hidden="true">&#8250;</span>
      </button>

      <div class="sidebar" id="sidebar">
        <table>
          <thead>

              <th>Mile</th>
              <th>Location</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>

        <p class="note">
          <span style="color: #7a3ec9; font-weight: 700">T</span> = Metrolink
          tram stop, <span style="color: #c0392b; font-weight: 700">E</span> =
          Event Village.
        </p>

        <footer>
          Route source:
          <a
            href="https://www.manchesterhalfmarathon.com/route-map/"
            target="_blank"
            >manchesterhalfmarathon.com/route-map</a
          >
        </footer>
      </div>
    </div>

      let points = DEFAULT_POINTS.map((p) => ({ ...p }));
      const routePoints = () =>
        points.filter((p) => !p.water).sort((a, b) => a.mile - b.mile);

      const map = L.map("map").setView([53.445, -2.29], 12);
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        {
          attribution:
            "&copy; Esri &mdash; Esri, DeLorme, NAVTEQ | &copy; OpenStreetMap contributors",
          maxZoom: 16,
        },
      ).addTo(map);
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 16 },
      ).addTo(map);

      let polyline = L.polyline([], { color: "#ff2d92", weight: 5 }).addTo(map);
      let markers = {};

      const meIcon = L.icon({
        iconUrl: "assets/runner.png",
        iconSize: [38, 64],
        iconAnchor: [19, 64],
        tooltipAnchor: [0, -70],
      });
      let liveMarker = L.marker([points[0].lat, points[0].lng], {
        icon: meIcon,
      }).addTo(map);
      liveMarker.bindTooltip("Mimi", { permanent: true, direction: "top" });

      function redrawMarkers() {
        Object.values(markers).forEach((m) => map.removeLayer(m));
        markers = {};
        points.forEach((p) => {
          const icon = L.divIcon({
            className: "",
            html: `<div style="background:${p.water ? "#0284c7" : "#4f46e5"};color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;border:3px solid #fff;box-shadow:0 2px 6px rgba(15,23,42,.25)">${p.water ? "W" : p.mile}</div>`,
            iconSize: [24, 24],
            iconAnchor: [12, 12],
          });
          const m = L.marker([p.lat, p.lng], { icon }).addTo(map);
          m.bindPopup(
            `<strong>${p.water ? "Water station" : "Mile " + p.mile}</strong><br>${p.name}`,
          );
          markers[p.id] = m;
        });
      }
      redrawMarkers();

      LANDMARKS.forEach((lm) => {
        const icon = L.divIcon({
          className: "",
          html: `<div style="background:${lm.tram ? "#7a3ec9" : "#c0392b"};color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;border:3px solid #fff;box-shadow:0 2px 6px rgba(15,23,42,.25)">${lm.tram ? "T" : "E"}</div>`,
          iconSize: [22, 22],
          iconAnchor: [11, 11],
        });
        L.marker([lm.lat, lm.lng], { icon })
          .addTo(map)
          .bindPopup(`<strong>${lm.name}</strong>`);
      });

      let routeGeometry = [];
      let cumDist = [];
      let totalDist = 0;

      function haversine(a, b) {
        const R = 6371000,
          toRad = (d) => (d * Math.PI) / 180;
        const dLat = toRad(b[0] - a[0]),
          dLng = toRad(b[1] - a[1]);
        const la1 = toRad(a[0]),
          la2 = toRad(b[0]);
        const h =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
      }

      function setGeometry(coords) {
        routeGeometry = coords;
        cumDist = [0];
        for (let i = 1; i < coords.length; i++) {
          cumDist.push(cumDist[i - 1] + haversine(coords[i - 1], coords[i]));
        }
        totalDist = cumDist[cumDist.length - 1] || 1;
        polyline.setLatLngs(routeGeometry);
      }

      function nearestNamedBefore(mile) {
        const rp = routePoints();
        let found = rp[0];
        for (const p of rp) {
          if (p.mile <= mile) found = p;
          else break;
        }
        return found;
      }

      function positionAtMile(mile) {
        mile = Math.max(0, Math.min(RACE_DISTANCE, mile));
        const after = nearestNamedBefore(mile);
        if (!routeGeometry.length) {
          return { lat: after.lat, lng: after.lng, after };
        }
        const targetDist = (mile / RACE_DISTANCE) * totalDist;
        for (let i = 0; i < cumDist.length - 1; i++) {
          if (targetDist >= cumDist[i] && targetDist <= cumDist[i + 1]) {
            const span = cumDist[i + 1] - cumDist[i] || 1;
            const f = (targetDist - cumDist[i]) / span;
            return {
              lat:
                routeGeometry[i][0] +
                (routeGeometry[i + 1][0] - routeGeometry[i][0]) * f,
              lng:
                routeGeometry[i][1] +
                (routeGeometry[i + 1][1] - routeGeometry[i][1]) * f,
              after,
            };
          }
        }
        const last = routeGeometry[routeGeometry.length - 1];
        return { lat: last[0], lng: last[1], after };
      }

      function parsePace(str) {
        str = str.trim();
        if (str.includes(":")) {
          const [m, s] = str.split(":").map(Number);
          return m + (s || 0) / 60;
        }
        return parseFloat(str) || 0;
      }

      const MILE_KM = 1.609344;
      const RACE_DATE = "2026-10-04";
      const WAVE_TIME = "11:07";
      const PACE_VALUE = "7:00";
      const PACE_UNIT = "km";

      function getPaceMinPerMile() {
        const raw = parsePace(PACE_VALUE);
        return PACE_UNIT === "km" ? raw * MILE_KM : raw;
      }

      function formatDate(d) {
        return d.toLocaleDateString("en-GB", {
          weekday: "short",
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      function formatTime(d) {
        return d.toLocaleTimeString("en-GB", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

      function getWaveStart() {
        return new Date(`${RACE_DATE}T${WAVE_TIME}:00`);
      }

      function renderTable(waveStart, pace) {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";
        const now = new Date();
        const currentMile =
          waveStart && pace ? (now - waveStart) / 60000 / pace : -1;
        points
          .slice()
          .sort((a, b) => a.mile - b.mile)
          .forEach((p) => {
            const tr = document.createElement("tr");
            const eta =
              waveStart && pace
                ? new Date(waveStart.getTime() + p.mile * pace * 60000)
                : null;
            const isNow =
              currentMile >= p.mile - 0.5 && currentMile < p.mile + 0.5;
            if (isNow) tr.className = "now";
            tr.innerHTML = `
      <td>${p.water ? "" : p.mile}</td>
      <td>${p.name}${p.water ? '<span class="tag water">water</span>' : ""}</td>
      <td>${eta ? formatTime(eta) : "—"}</td>`;
            tbody.appendChild(tr);
          });
      }

      function updateLive() {
        const waveStart = getWaveStart();
        const pace = getPaceMinPerMile();
        const statusTextEl = document.getElementById("status-text");
        const statusDotEl = document.getElementById("status-dot");

        const now = new Date();
        const elapsedMin = (now - waveStart) / 60000;
        const finishMin = RACE_DISTANCE * pace;
        const isLive = elapsedMin >= 0 && elapsedMin < finishMin;
        statusDotEl.classList.toggle("live", isLive);

        const startOfDay = (d) =>
          new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const dayDiff = Math.round(
          (startOfDay(waveStart) - startOfDay(now)) / 86400000,
        );

        if (dayDiff > 0) {
          statusTextEl.textContent = `Race day is ${formatDate(waveStart)} — ${dayDiff} day${dayDiff === 1 ? "" : "s"} to go.`;
        } else if (dayDiff < 0) {
          statusTextEl.textContent = `Race day (${formatDate(waveStart)}) has passed.`;
        } else if (elapsedMin < 0) {
          statusTextEl.textContent = `Not started yet — wave starts at ${formatTime(waveStart)}`;
        } else if (elapsedMin >= finishMin) {
          const finishTime = new Date(waveStart.getTime() + finishMin * 60000);
          statusTextEl.textContent = `Finished! Estimated finish around ${formatTime(finishTime)} — head to the finish area`;
          const finishPt = points.find((p) => p.id === "finish");
          liveMarker.setLatLng([finishPt.lat, finishPt.lng]);
        } else {
          const mile = elapsedMin / pace;
          const pos = positionAtMile(mile);
          statusTextEl.textContent = `Right now (${formatTime(now)}): approx. mile ${mile.toFixed(1)} — just past ${pos.after.name}`;
          liveMarker.setLatLng([pos.lat, pos.lng]);
        }

        renderTable(waveStart, pace);
      }

      const layoutEl = document.getElementById("layout");
      const sidebarEl = document.getElementById("sidebar");
      const sidebarToggle = document.getElementById("sidebar-toggle");
      const sidebarChevron = document.getElementById("sidebar-chevron");
      sidebarToggle.addEventListener("click", () => {
        const expanded = sidebarToggle.getAttribute("aria-expanded") === "true";
        sidebarToggle.setAttribute("aria-expanded", String(!expanded));
        sidebarEl.classList.toggle("collapsed", expanded);
        layoutEl.classList.toggle("sidebar-collapsed", expanded);
        sidebarChevron.innerHTML = expanded ? "&#8249;" : "&#8250;";
        setTimeout(() => map.invalidateSize(), 260);
      });

      window.addEventListener("resize", () => map.invalidateSize());
      setTimeout(() => map.invalidateSize(), 300);

      setGeometry(ROUTE_LINE);
      updateLive();
      setInterval(updateLive, 15000);
    </script>
